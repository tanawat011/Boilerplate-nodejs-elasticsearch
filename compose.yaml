# One Elasticsearch node for development and the tests. DEV ONLY: security
# is on (user `elastic`, password from .env — copy .env.example), but HTTP
# is plain, so the port is bound to 127.0.0.1 only.
name: boilerplate-nodejs-elasticsearch

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?copy .env.example to .env}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false" # plain HTTP: dev only
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1536m
    ports:
      - "127.0.0.1:${ES_PORT:-19200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"elastic:$$ELASTIC_PASSWORD\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

volumes:
  esdata:
